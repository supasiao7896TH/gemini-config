name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Antigravity Config & Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format check (prettier)
        run: npm run lint

      - name: Secret leak check (secretlint)
        run: npm run secrets

      - name: Configuration & Persona standards check
        run: npm run standards
